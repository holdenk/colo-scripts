# Post-upgrade verification
- hosts: kube-leader
  vars_files:
    - k3s-vars.yaml
  tasks:
  - name: Verify all nodes show new version
    ansible.builtin.shell: "kubectl get nodes -o wide"
    register: final_nodes
    changed_when: false
    become: true

  - name: Show final node status
    debug:
      msg: "{{ final_nodes.stdout_lines }}"

  - name: Check for non-Running system pods
    ansible.builtin.shell: "kubectl get pods -n kube-system --no-headers | grep -v Running | grep -v Completed || echo 'All system pods healthy'"
    register: system_pods
    changed_when: false
    become: true

  - name: Show system pod status
    debug:
      msg: "{{ system_pods.stdout_lines }}"

  - name: Check ingress controller pods
    ansible.builtin.shell: "kubectl get pods --all-namespaces | grep -E '(traefik|ingress)' || echo 'No ingress pods found'"
    register: ingress_pods
    changed_when: false
    become: true

  - name: Show ingress status
    debug:
      msg: "{{ ingress_pods.stdout_lines }}"

  - name: Check Longhorn pods
    ansible.builtin.shell: "kubectl get pods -n longhorn-system --no-headers | grep -v Running | grep -v Completed || echo 'All Longhorn pods healthy'"
    register: longhorn_pods
    changed_when: false
    become: true

  - name: Show Longhorn status
    debug:
      msg: "{{ longhorn_pods.stdout_lines }}"

  - name: Upgrade complete
    debug:
      msg: "K3s cluster upgrade to {{ k3s_version }} complete. Review output above for any issues."

#Generic
  - name: Create a SA for Spark
    community.kubernetes.k8s:
      name: spark
      namespace: spark
      api_version: v1
      kind: serviceaccount
      state: present
  - name: Create a role for Spark
    community.kubernetes.k8s:
      name: spark-rb
      namespace: spark
      definition:
        roleRef:
          apiGroup: rbac.authorization.k8s.io
          kind: ClusterRole
          name: edit
        subjects:
        - kind: ServiceAccount
          name: spark
          namespace: spark
      api_version: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      state: present
  - name: Create longhorn Ingress https
    community.kubernetes.k8s:
      definition:
        apiVersion: networking.k8s.io/v1
        kind: Ingress
        metadata:
          name: longhorn-ingress
          namespace: longhorn-system
          annotations:
            # nginx
            nginx.ingress.kubernetes.io/auth-type: basic
            nginx.ingress.kubernetes.io/auth-secret: basic-auth
#            cert-manager.io/cluster-issuer: letsencrypt
#            cert-manager.io/issue-temporary-certificate: "true"
#            acme.cert-manager.io/http01-edit-in-place: "true"
            nginx.ingress.kubernetes.io/auth-realm: 'Authentication Required '
            nginx.ingress.kubernetes.io/proxy-body-size: 10000m
#            nginx.ingress.kubernetes.io/configuration-snippet: |
#              proxy_set_header "Host" "$host";
#              real_ip_header X-Forwarded-For;
#              proxy_set_header  "X-Forwarded-For" "$proxy_add_x_forwarded_for";
#              real_ip_recursive on;
        spec:
          ingressClassName: nginx
#          tls:
#          - hosts:
#              - longhorn.pigscanfly.ca
#            secretName: longhorn-tls-secret
          rules:
            - host: "longhorn.pigscanfly.ca"
              http:
                paths:
                - pathType: Prefix
                  path: "/"
                  backend:
                    service:
                      name: longhorn-frontend
                      port:
                        number: 80
  - name: Deploy opensearch operator
    kubernetes.core.helm:
      name: opensearch-operator
      chart_ref: opensearch-operator/opensearch-operator
      release_namespace: opensearch
      create_namespace: true

  - name: Create spacebeaver Ray secrets
    community.kubernetes.k8s:
      definition:
        apiVersion: v1
        kind: Secret
        metadata:
          name: spacebeaver-ray-secret
          namespace: spacebeaver
        stringData:
          mail_server: "{{spacebeaver_mail_server}}"
          mail_username: "{{spacebeaver_mail_username}}"
          mail_password: "{{spacebeaver_mail_password}}"
          swarm_username: "{{swarm_username}}"
          swarm_password: "{{swarm_password}}"
      state: present
  - name: Create spacebeaver config
    community.kubernetes.k8s:
      definition:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: spacebeaver-web-config
          namespace: spacebeaver
        type: Opaque
        data:
          DOMAIN: "spacebeaver.com"
          STATIC_URL: "/static/"
          MEDIA_URL: "/media/"
      state: present
  - name: Check if helm is already installed
    ansible.builtin.stat:
      path: /usr/local/bin/helm
    register: helm_stat
  - name: Install helm
    args:
      creates: /usr/local/bin/helm
    ansible.builtin.shell: "curl https://raw.githubusercontent.com/helm/helm/master/scripts/get-helm-3 | bash"
    become: true
    when: not helm_stat.stat.exists
  - name: Add gpu operator
    kubernetes.core.helm_repository:
      name: nvidia
      repo_url: "https://helm.ngc.nvidia.com/nvidia"
  - name: Add opensearch-operator
    kubernetes.core.helm_repository:
      name: opensearch-operator
      repo_url: "https://opensearch-project.github.io/opensearch-k8s-operator/"
  - name: Add cnpg
    kubernetes.core.helm_repository:
      name: cnpg
      repo_url: "https://cloudnative-pg.github.io/charts"
  - name: Add dns override
    kubernetes.core.helm_repository:
      name: eugenmayer
      repo_url: "https://eugenmayer.github.io/helm-charts/"
  - name: Add bitnami chart
    kubernetes.core.helm_repository:
      name: bitnami
      repo_url: "https://charts.bitnami.com/bitnami"
  - name: Add MinIO operator chart
    kubernetes.core.helm_repository:
      name: minio-operator
      repo_url: "https://operator.min.io/"
  - name: Add legacy MinIO chart
    kubernetes.core.helm_repository:
      name: minio
      repo_url: "https://charts.min.io/"
  - name: Add bitnami
    kubernetes.core.helm_repository:
      name: bitnami
      repo_url: "https://charts.bitnami.com/bitnami"
  - name: Add Traefik chart
    kubernetes.core.helm_repository:
      name: traefik
      repo_url: "https://helm.traefik.io/traefik/"
  - name: Add ingress-nginx chart
    kubernetes.core.helm_repository:
      name: ingress-nginx
      repo_url: "https://kubernetes.github.io/ingress-nginx"
  - name: Add Rook Ceph chart
    kubernetes.core.helm_repository:
      name: rook-release
      repo_url: "https://charts.rook.io/release"
  - name: Add longhorn chart
    kubernetes.core.helm_repository:
      name: longhorn
      repo_url: "https://charts.longhorn.io"
  - name: Add ray chart
    kubernetes.core.helm_repository:
      name: kuberay
      repo_url: https://ray-project.github.io/kuberay-helm/
  - name: Add cert-manager chart
    kubernetes.core.helm_repository:
      name: jetstack
      repo_url: "https://charts.jetstack.io"
  - name: Add metallb chart
    kubernetes.core.helm_repository:
      name: metallb
      repo_url: "https://metallb.github.io/metallb"
  - name: Install / upgrade Metallb via Helm
    kubernetes.core.helm:
      name: metallb
      chart_ref: metallb/metallb
      release_namespace: metallb-system
      create_namespace: false
      wait: yes
      wait_timeout: 600s
      values:
        speaker:
          frr:
            enabled: false
  - name: Apply Metallb config (pools + BGP/L2)
    community.kubernetes.k8s:
      state: present
      src: /home/holden/repos/colo-scripts/metallb-config2.yaml
      wait: yes
      wait_timeout: 120
  - name: Deplot cloud native postgres
    kubernetes.core.helm:
      name: cnpg
      chart_ref: cnpg/cloudnative-pg
      release_namespace: cnpg-system
      create_namespace: true
  - name: Deplot cloud native postgres backup plugin
    kubernetes.core.helm:
      name: barman-cloud
      chart_ref: cnpg/plugin-barman-cloud
      release_namespace: cnpg-system
      create_namespace: true
  - name: Deploy nginx
    kubernetes.core.helm:
      name: ingress-nginx
      chart_ref: ingress-nginx/ingress-nginx
      release_namespace: nginx
      chart_version: 4.13.4
      create_namespace: true
      wait: yes
      values:
        controller:
          service:
            loadBalancerIP: 10.42.0.200
            externalTrafficPolicy: Local
          watchIngressWithoutClass: true
          allowSnippetAnnotations: true
          ipFamilyPolicy: PreferDualStack
          ipFamilies:
            - IPv4
            - IPv6
          proxy-real-ip-cidr: "127.0.0.1/32,10.42.4.0/8"
          maxmindLicenseKey: "{{maxmindkey}}"
  - name: Deploy cert manager
    kubernetes.core.helm:
      name: cert-manager
      chart_ref: "jetstack/cert-manager"
      release_namespace: cert-manager
      chart_version: v1.19.1
      create_namespace: true
      wait: yes
      values:
        installCRDs: true
  - name: Create staging certificate issuer
    community.kubernetes.k8s:
      definition:
        apiVersion: cert-manager.io/v1
        kind: ClusterIssuer
        metadata:
          name: letsencrypt-staging
          namespace: cert-manager
        spec:
          acme:
            # The ACME server URL
            server: https://acme-staging-v02.api.letsencrypt.org/directory
            # Email address used for ACME registration
            email: holden@pigscanfly.ca
            # Name of a secret used to store the ACME account private key
            privateKeySecretRef:
              name: letsencrypt-staging
            # Enable the HTTP-01 challenge provider
            solvers:
              - http01:
                  ingress:
                    class: nginx
  - name: Create prod certificate issuer
    community.kubernetes.k8s:
      definition:
        apiVersion: cert-manager.io/v1
        kind: ClusterIssuer
        metadata:
          name: letsencrypt
        spec:
          acme:
            # The ACME server URL
            server: https://acme-v02.api.letsencrypt.org/directory
            # Email address used for ACME registration
            email: holden@pigscanfly.ca
            # Name of a secret used to store the ACME account private key
            privateKeySecretRef:
              name: letsencrypt-prod
            # Enable the HTTP-01 challenge provider
            solvers:
              - http01:
                  ingress:
                    class: nginx

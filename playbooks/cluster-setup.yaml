# traefik has been annoying me lately, lets try nginx for new bugs
# longhorn gets sad in any NS other than longhorn-system :/
  - name: Deploy longhorn
    kubernetes.core.helm:
      name: longhorn
      chart_ref: longhorn/longhorn
      release_namespace: longhorn-system
      chart_version: 1.10.1
      create_namespace: true
      values:
        defaultSettings:
          defaultDataPath: /db/encrypted/magic8
          createDefaultDiskLabeledNodes: true
  - name: Create minio secret for Jupyter
    community.kubernetes.k8s:
      definition:
        apiVersion: v1
        kind: Secret

        metadata:
          name: minio
          namespace: jhub

        type: Opaque

        stringData:
          accessKey: "{{minio_accesskey}}"
          secretKey: "{{minio_holden_secret}}"
      state: present
  - name: Create a namespace for Spark
    community.kubernetes.k8s:
      name: spark
      api_version: v1
      kind: Namespace
      state: present
  - name: Create a SA for holdenk
    community.kubernetes.k8s:
      name: holdenk
      namespace: jhub
      api_version: v1
      kind: serviceaccount
      state: present
  - name: Create a role binding dask
    community.kubernetes.k8s:
      name: jhub-holdenk-rb-dask
      namespace: dask
      definition:
        roleRef:
          apiGroup: rbac.authorization.k8s.io
          kind: ClusterRole
          name: edit
        subjects:
        - kind: ServiceAccount
          name: holdenk
          namespace: jhub
      api_version: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      state: present
  - name: Create a role binding spark
    community.kubernetes.k8s:
      name: jhub-holdenk-rb-spark
      namespace: dask
      definition:
        roleRef:
          apiGroup: rbac.authorization.k8s.io
          kind: ClusterRole
          name: edit
        subjects:
        - kind: ServiceAccount
          name: holdenk
          namespace: jhub
      api_version: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      state: present
  - name: Create a role binding holdenk ray
    community.kubernetes.k8s:
      name: jhub-holdenk-rb-ray
      namespace: ray
      definition:
        roleRef:
          apiGroup: rbac.authorization.k8s.io
          kind: ClusterRole
          name: edit
        subjects:
        - kind: ServiceAccount
          name: holdenk
          namespace: jhub
      api_version: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      state: present
# Mika role binding
  - name: Create a SA for mkimmins
    community.kubernetes.k8s:
      name: mkimmins
      namespace: jhub
      api_version: v1
      kind: serviceaccount
      state: present
  - name: Create a role binding mika
    community.kubernetes.k8s:
      name: jhub-mika-rb
      namespace: mika
      definition:
        roleRef:
          apiGroup: rbac.authorization.k8s.io
          kind: ClusterRole
          name: edit
        subjects:
        - kind: ServiceAccount
          name: mkimmins
          namespace: jhub
      api_version: rbac.authorization.k8s.io/v1

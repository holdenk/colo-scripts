---
- hosts: localhost
  tasks:
  - name: Create Kubernetes namespaces
    community.kubernetes.k8s:
      name: "{{ item }}"
      api_version: v1
      kind: Namespace
      state: present
    loop:
      - longhorn-system
      - totallylegitco
      - cacti
      - pcfweb
      - minio
      - dask
      - docker-registry
      - ray
      - metallb-system
      - jhub
      - spacebeaver
      - mika
      - spark
  - name: Create cacti secret
    community.kubernetes.k8s:
      definition:
        apiVersion: v1
        kind: Secret
        metadata:
          name: cacti-secrets
          namespace: cacti
        type: Opaque
        stringData:
          DB_HOST: "nani.pigscanfly.ca"
          DB_USER: "cacti"
          DB_PASS: "{{ cacti_db_pw }}"
          DB_NAME: "cacti"
      state: present
  - name: Create longhorn secret
    ansible.builtin.shell: "(kubectl get ns longhorn-system || kubectl create ns longhorn-system);(echo holden:$(openssl passwd -stdin -apr1 <<< {{longhorn_pw}}) >> auth); kubectl get secret -n longhorn-system basic-auth || kubectl -n longhorn-system create secret generic basic-auth --from-file=auth"
    args:
      executable: /bin/bash
  - name: Create metallb secret
    community.kubernetes.k8s:
      definition:
        apiVersion: v1
        kind: Secret
        metadata:
          name: memberlist
          namespace: metallb-system
        type: Opaque
        stringData:
          secretkey: "{{metallb_key}}"
      state: present
  - name: Create pcfweb secret
    community.kubernetes.k8s:
      definition:
        apiVersion: v1
        kind: Secret
        metadata:
          name: pcfweb-secret
          namespace: pcfweb
        stringData:
          STRIPE_LIVE_SECRET_KEY: "{{PCF_STRIPE_LIVE_SECRET_KEY}}"
          STRIPE_LIVE_PUBLIC_KEY: "{{PCF_STRIPE_LIVE_PUBLIC_KEY}}"
          STRIPE_TEST_SECRET_KEY: "{{PCF_STRIPE_TEST_SECRET_KEY}}"
          STRIPE_TEST_PUBLIC_KEY: "{{PCF_STRIPE_TEST_PUBLIC_KEY}}"
          DJSTRIPE_WEBHOOK_SECRET: "{{PCF_DJSTRIPE_WEBHOOK_SECRET}}"
          STRIPE_WEBHOOK_SECRET: "{{PCF_DJSTRIPE_WEBHOOK_SECRET}}"
          DJANGO_CONFIGURATION: "Prod"
          SECRET_KEY: "{{SPACEBEAVER_DJANGO_SECRET_KEY}}"
          __ENV__: "Prod"
          ENVIRONMENT: "Prod"
          # The secret half of pcfweb's outbound mail. The rest of the pair --
          # EMAIL_HOST / EMAIL_PORT / EMAIL_USE_TLS / EMAIL_USE_SSL /
          # EMAIL_HOST_USER -- lives in the pcfweb-db-config ConfigMap in the
          # pcfweb repo's deploy.yaml, which is listed after this Secret in
          # envFrom and therefore wins. That pair says mail.pigscanfly.ca:465
          # (submissions, TLS from the first byte) as user "support" -- the
          # domain's own mail server, by its MX name because the apex is
          # Cloudflare-proxied and carries no SMTP -- so this vault value is
          # that account's password; empty just turns SMTP AUTH off. Details,
          # including the live-DNS story (the bind-zones/ copies here are
          # retired): docs/email.md in the pcfweb repo.
          EMAIL_HOST_PASSWORD: "{{pcf_email_host_password}}"
          DBPASSWORD: "{{pcfweb_db_pw}}"
          # The Django admin account. pcfweb's primary pod runs
          # `manage.py ensure_admin_account` on every boot: it creates the
          # superuser on a fresh database and converges it afterwards, so a
          # password rotated here (vault edit + re-run this playbook + roll
          # web-primary) actually takes effect. The variable names are the
          # ones Django's own `createsuperuser --noinput` reads.
          #
          # default('') so this playbook still runs before the vault entries
          # exist -- add PCF_ADMIN_USER, PCF_ADMIN_PASSWORD and (optional)
          # PCF_ADMIN_EMAIL to passwd.yml to enable. Empty values make the
          # app skip admin setup with a log line; user or password set
          # without the other makes the app complain loudly in the primary
          # pod's log, since that is usually a typo'd vault key.
          DJANGO_SUPERUSER_USERNAME: "{{PCF_ADMIN_USER | default('')}}"
          DJANGO_SUPERUSER_PASSWORD: "{{PCF_ADMIN_PASSWORD | default('')}}"
          DJANGO_SUPERUSER_EMAIL: "{{PCF_ADMIN_EMAIL | default('')}}"
      state: present
  - name: Create pcfweb DB secret
    community.kubernetes.k8s:
      definition:
        apiVersion: v1
        kind: Secret
        type: kubernetes.io/basic-auth
        metadata:
          name: pcfweb-internal-pg-secret
          namespace: pcfweb
        stringData:
          username: "pigscanfly"
          password: "{{pcfweb_db_pw}}"
      state: present
  - name: Create pcfweb DB secret
    community.kubernetes.k8s:
      definition:
        apiVersion: v1
        kind: Secret
        type: kubernetes.io/basic-auth
        metadata:
          name: pcfweb-superuser-pg-secret
          namespace: pcfweb
        stringData:
          username: "postgres"
          password: "{{pcfweb_su_db_pw}}"
      state: present
  - name: Create pcfweb backup secret
    community.kubernetes.k8s:
      definition:
        apiVersion: v1
        kind: Secret
        metadata:
          name: pcfweb-pg-backup
          namespace: pcfweb
        stringData:
          PG_ACCESS_KEY_ID: "{{pcfweb_b2_id}}"
          PG_ACCESS_SECRET_KEY: "{{pcfweb_b2_secret}}"
      state: present
  - name: Create spacebeaver secrets
    community.kubernetes.k8s:
      definition:
        apiVersion: v1
        kind: Secret
        metadata:
          name: spacebeaver-secret
          namespace: spacebeaver
        stringData:
          STRIPE_LIVE_SECRET_KEY: "{{SPACEBEAVER_STRIPE_LIVE_SECRET_KEY}}"
          STRIPE_LIVE_PUBLIC_KEY: "{{SPACEBEAVER_STRIPE_LIVE_PUBLIC_KEY}}"
          STRIPE_TEST_SECRET_KEY: "{{SPACEBEAVER_STRIPE_TEST_SECRET_KEY}}"
          STRIPE_TEST_PUBLIC_KEY: "{{SPACEBEAVER_STRIPE_TEST_PUBLIC_KEY}}"
          DJSTRIPE_WEBHOOK_SECRET: "{{SPACEBEAVER_DJSTRIPE_WEBHOOK_SECRET}}"
          SECRET_KEY: "{{SPACEBEAVER_DJANGO_SECRET_KEY}}"
          DATA_NETLOC: "postgresql://spacebeaver:{{spacebeaver_db_pw}}@nani.pigscanfly.ca:5432/spacebeaver"
          RABBITMQ_DEFAULT_USER: "django"
          RABBITMQ_DEFAULT_PASS: "{{SPACEBEAVER_RABIT_MQ_PASS}}"
          BROKER_NETLOC: "pyamqp://django:{{SPACEBEAVER_RABIT_MQ_PASS}}@rabbitmq-service:5672/"
          __ENV__: "Runtime"
          ENVIRONMENT: "production"
          SSL: "on"
      state: present
  - name: Ensure image pull secret exists for totallylegitco
    kubernetes.core.k8s:
      state: present
      namespace: totallylegitco
      definition:
        apiVersion: v1
        kind: Secret
        metadata:
          name: secret-docker
        type: kubernetes.io/dockerconfigjson
        data:
          .dockerconfigjson: "{{ {
          'auths': {
            'https://registry-1.docker.io': {
              'username': k3s_docker_username,
              'password': k3s_docker_pw,
              'auth': (k3s_docker_username ~ ':' ~ k3s_docker_pw) | b64encode
            }
          }
          } | to_json | b64encode }}"
  # Consumed (optionally) by the vLLM deployments in
  # healthinsurance-llm-internal/serve_kube*.yaml as HF_TOKEN, so model pulls
  # from the HuggingFace Hub are authenticated instead of anonymous —
  # anonymous pulls get throttled (HTTP 504) once a crash-looping pod has
  # re-downloaded the model a few dozen times.  A fine-grained read-only
  # token is enough; add HF_HUB_TOKEN to the vault (passwd.yml) to enable.
  - name: Create totallylegitco HuggingFace Hub token secret
    community.kubernetes.k8s:
      definition:
        apiVersion: v1
        kind: Secret
        metadata:
          name: hf-token
          namespace: totallylegitco
        stringData:
          token: "{{HF_HUB_TOKEN}}"
      state: present
    when: HF_HUB_TOKEN is defined
  - name: Create totallylegitco primary secrets
    community.kubernetes.k8s:
      definition:
        apiVersion: v1
        kind: Secret
        metadata:
          name: fight-health-insurance-primary-secret
          namespace: totallylegitco
        stringData:
          FIGHT_HEALTH_ADMIN_USER: "{{FIGHT_HEALTH_ADMIN_USER}}"
          FIGHT_HEALTH_ADMIN_PASSWORD: "{{FIGHT_HEALTH_ADMIN_PASSWORD}}"
      state: present
  - name: Create totallylegitco superuser-pg-secret
    community.kubernetes.k8s:
      definition:
        apiVersion: v1
        kind: Secret
        type: kubernetes.io/basic-auth
        metadata:
          name: fhi-superuser-pg-secret
          namespace: totallylegitco
        stringData:
          username: "{{FIGHT_HEALTH_PG_ADMIN_USER}}"
          password: "{{FIGHT_HEALTH_PG_ADMIN_PASSWORD}}"
      state: present
  - name: Create totallylegitco fhi-pg-secret
    community.kubernetes.k8s:
      definition:
        apiVersion: v1
        kind: Secret
        type: kubernetes.io/basic-auth
        metadata:
          name: fhi-internal-pg-secret
          namespace: totallylegitco
        stringData:
          username: "{{FIGHT_HEALTH_PG_USER}}"
          password: "{{FIGHT_HEALTH_PG_PASSWORD}}"
      state: present
  - name: Create totallylegitco pg-backup secret
    community.kubernetes.k8s:
      definition:
        apiVersion: v1
        kind: Secret
        metadata:
          name: pg-backup
          namespace: totallylegitco
        stringData:
          PG_ACCESS_KEY_ID: "{{PG_B2_ACCESS_KEY_ID}}"
          PG_ACCESS_SECRET_KEY: "{{PG_B2_SECRET_KEY}}"
      state: present
  - name: Create totallylegitco pg-backup2 secret
    community.kubernetes.k8s:
      definition:
        apiVersion: v1
        kind: Secret
        metadata:
          name: pg-backup2
          namespace: totallylegitco
        stringData:
          PG_ACCESS_KEY_ID: "{{PG_B2_ACCESS_KEY_ID3}}"
          PG_ACCESS_SECRET_KEY: "{{PG_B2_SECRET_KEY3}}"
      state: present
  - name: Create totallylegitco magic-rag-secret
    community.kubernetes.k8s:
      definition:
        apiVersion: v1
        kind: Secret
        metadata:
          name: magic-rag-secret
          namespace: totallylegitco
        stringData:
          RAG_SECRET_KEY: "{{RAG_SECRET_KEY}}"
          RAG_OPENSEARCH_PASSWORD: "{{RAG_OPENSEARCH_PASSWORD}}"
  - name: Create totallylegitco fight-health-insurance-secret
    community.kubernetes.k8s:
      definition:
        apiVersion: v1
        kind: Secret
        metadata:
          name: fight-health-insurance-secret
          namespace: totallylegitco
        stringData:
          RAG_SECRET_KEY: "{{RAG_SECRET_KEY}}"
          RAG_OPENSEARCH_PASSWORD: "{{RAG_OPENSEARCH_PASSWORD}}"
          PDBUSER: "{{FIGHT_HEALTH_PG_USER}}"
          PDBPASSWORD: "{{FIGHT_HEALTH_PG_PASSWORD}}"
          PDBNAME: "app"
          PDBHOST: "fhi-pg-main-8-rw.totallylegitco.svc"
          AZURE_OPENAI_API_KEY: "{{AZURE_OPENAI_API_KEY}}"
          AZURE_OPENAI_ENDPOINT: "{{AZURE_OPENAI_ENDPOINT}}"
          AZURE_OPENAI_MODELS: "{{AZURE_OPENAI_MODELS}}"
          AZURE_ANTHROPIC_API_KEY: "{{AZURE_ANTHROPIC_API_KEY}}"
          AZURE_ANTHROPIC_MODELS: "{{AZURE_ANTHROPIC_MODELS}}"
          AZURE_ANTHROPIC_ENDPOINT: "{{AZURE_ANTHROPIC_ENDPOINT}}"
          ALPHA_HEALTH_BACKEND_HOST: "{{ALPHA_HEALTH_BACKEND_HOST}}"
          ALPHA_HEALTH_BACKEND_PORT: "{{ALPHA_HEALTH_BACKEND_PORT}}"
          ALPHA_HEALTH_BACKUP_BACKEND_HOST: "{{ALPHA_HEALTH_BACKUP_BACKEND_HOST}}"
          ALPHA_HEALTH_BACKUP_BACKEND_PORT: "{{ALPHA_HEALTH_BACKUP_BACKEND_PORT}}"
          STRIPE_LIVE_SECRET_KEY: "{{FUCK_STRIPE_LIVE_SECRET_KEY}}"
          STRIPE_LIVE_PUBLIC_KEY: "{{FUCK_STRIPE_LIVE_PUBLIC_KEY}}"
          STRIPE_TEST_SECRET_KEY: "{{FUCK_STRIPE_TEST_SECRET_KEY}}"
          STRIPE_TEST_PUBLIC_KEY: "{{FUCK_STRIPE_TEST_PUBLIC_KEY}}"
          STRIPE_WEBHOOK_SECRET: "{{TLC_SWS}}"
          DJSTRIPE_WEBHOOK_SECRET: "{{FUCK_DJSTRIPE_WEBHOOK_SECRET}}"
          RECAPTCHA_PUBLIC_KEY: "{{FUCK_RECAPTCHA_PUBLIC_KEY}}"
          RECAPTCHA_PRIVATE_KEY: "{{FUCK_RECAPTCHA_PRIVATE_KEY}}"
          SECRET_KEY: "{{FUCK_DJANGO_SECRET_KEY}}"
          DBPASSWORD: "{{fuckhealthinsurance_db_pw}}"
          DBNAME: "fuckhealthinsurance"
          DBUSER: "fuckhealthinsurance"
          DBHOST: "nani.pigscanfly.ca"
          __ENV__: "Runtime"
          ENVIRONMENT: "Prod"
          DJANGO_SETTINGS_MODULE: "fighthealthinsurance.settings"
          SENTRY_ENDPOINT: "{{SENTRY_ENDPOINT}}"
          FAXYMCFAXFACE_HOST: "10.69.197.33"
          SSL: "on"
          OPENAI_API_BASE: "https://api.endpoints.anyscale.com/v1"
          OPENAI_API_KEY: "{{OPENAI_API_KEY}}"
          RUNPOD_API_KEY: "{{RUNPOD_API_KEY}}"
          RUNPOD_ENDPOINT: "{{RUNPOD_ENDPOINT}}"
          HEALTH_BACKEND_HOST: "{{HEALTH_BACKEND_HOST}}"
          HEALTH_BACKEND_PORT: "{{HEALTH_BACKEND_PORT}}"
          HEALTH_BACKEND_MODEL: "{{HEALTH_BACKEND_MODEL}}"
          NEW_HEALTH_BACKEND_HOST: "{{NEW_HEALTH_BACKEND_HOST}}"
          HEALTH_BACKUP_BACKEND_HOST: "{{HEALTH_BACKUP_BACKEND_HOST}}"
          HEALTH_BACKUP_BACKEND_PORT: "{{HEALTH_BACKUP_BACKEND_PORT}}"
          HEALTH_BACKUP_BACKEND_MODEL: "{{HEALTH_BACKUP_BACKEND_MODEL}}"
          TOGETHER_KEY: "{{TOGETHER_KEY}}"
          ANTHROPIC_API_KEY: "{{CLAUDE_API_KEY}}"
          PERPLEXITY_API: "{{PERPLEXITY_API}}"
          OCTOAI_TOKEN: "{{OCTOAI_TOKEN}}"
          EMAIL_HOST: "smtp.sendgrid.net"
          EMAIL_HOST_PORT: "465"
          EMAIL_HOST_USER: "{{HEALTH_EMAIL_HOST_USER}}"
          EMAIL_HOST_PASSWORD: "{{HEALTH_EMAIL_HOST_PASSWORD}}"
          EX_MINIO_ACCESS: "{{EX_MINIO_ACCESS}}"
          EX_MINIO_SECRET: "{{EX_MINIO_SECRET}}"
          EX_MINIO_BUCKET: "{{EX_MINIO_BUCKET_ALT}}"
          EX_MINIO_REGION: "{{EX_MINIO_REGION}}"
          EX_MINIO_HOST: "{{EX_MINIO_HOST}}"
          EX_MINIO_HOST_ENDPOINT: "{{EX_MINIO_HOST}}:443"
          EX_MINIO_USE_HTTPS: "{{EX_MINIO_HTTPS}}"
          EX_MINIO_CERT_CHECK: "{{EX_MINIO_CERT_CHECK}}"
          DEEPINFRA_API: "{{DEEPINFRA_TOKEN}}"
          RAY_ADDRESS: "ray://raycluster-kuberay-head-svc.totallylegitco.svc:10001"
          NBC_API_KEY: "{{NBC_API_KEY}}"
          NBCI_API_KEY: "{{NBC_API_KEY}}"
          NCBI_API_KEY: "{{NBC_API_KEY}}"
          DJANGO_CONFIGURATION: "Prod"
          SONIC_USERNAME: "{{SONIC_USERNAME}}"
          SONIC_TOKEN: "{{SONIC_TOKEN}}"
          SONIC_PASSWORD: "{{SONIC_PASSWORD}}"
      state: present
  - name: Create dev FHI secret
    community.kubernetes.k8s:
      definition:
        apiVersion: v1
        kind: Secret
        metadata:
          name: fight-health-insurance-secret-dev
          namespace: totallylegitco
        stringData:
          ENVIRONMENT: "Dev"
          DJANGO_SETTINGS_MODULE: "fighthealthinsurance.settings"
          SSL: "on"
          HEALTH_BACKEND_HOST: "{{HEALTH_BACKEND_HOST}}"
          HEALTH_BACKEND_PORT: "{{HEALTH_BACKEND_PORT}}"
          HEALTH_BACKEND_MODEL: "{{HEALTH_BACKEND_MODEL}}"
          HEALTH_BACKUP_BACKEND_HOST: "{{HEALTH_BACKUP_BACKEND_HOST}}"
          HEALTH_BACKUP_BACKEND_PORT: "{{HEALTH_BACKUP_BACKEND_PORT}}"
          HEALTH_BACKUP_BACKEND_MODEL: "{{HEALTH_BACKUP_BACKEND_MODEL}}"
          DJANGO_CONFIGURATION: "Dev"
          FIGHT_HEALTH_ADMIN_USER: "{{FIGHT_HEALTH_ADMIN_USER_DEV}}"
          FIGHT_HEALTH_ADMIN_PASSWORD: "{{FIGHT_HEALTH_ADMIN_USER_DEV}}"
      state: present
  - name: Create spacebeaver Ray secrets
    community.kubernetes.k8s:
      definition:
        apiVersion: v1
        kind: Secret
        metadata:
          name: spacebeaver-ray-secret
          namespace: spacebeaver
        stringData:
          mail_server: "{{spacebeaver_mail_server}}"
          mail_username: "{{spacebeaver_mail_username}}"
          mail_password: "{{spacebeaver_mail_password}}"
          swarm_username: "{{swarm_username}}"
          swarm_password: "{{swarm_password}}"
      state: present
  - name: Create spacebeaver config
    community.kubernetes.k8s:
      definition:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: spacebeaver-web-config
          namespace: spacebeaver
        type: Opaque
        data:
          DOMAIN: "spacebeaver.com"
          STATIC_URL: "/static/"
          MEDIA_URL: "/media/"
      state: present
  - name: Check if helm is already installed
    ansible.builtin.stat:
      path: /usr/local/bin/helm
    register: helm_stat
  - name: Install helm
    args:
      creates: /usr/local/bin/helm
    ansible.builtin.shell: "curl https://raw.githubusercontent.com/helm/helm/master/scripts/get-helm-3 | bash"
    become: true
    when: not helm_stat.stat.exists
  - name: Add Helm chart repositories
    kubernetes.core.helm_repository:
      name: "{{ item.name }}"
      repo_url: "{{ item.url }}"
      force_update: true
    loop:
      - {name: nvidia, url: "https://helm.ngc.nvidia.com/nvidia"}
      - {name: opensearch-operator, url: "https://opensearch-project.github.io/opensearch-k8s-operator/"}
      - {name: cnpg, url: "https://cloudnative-pg.github.io/charts"}
      - {name: eugenmayer, url: "https://eugenmayer.github.io/helm-charts/"}
      - {name: bitnami, url: "https://charts.bitnami.com/bitnami"}
      - {name: minio-operator, url: "https://operator.min.io/"}
      - {name: minio, url: "https://charts.min.io/"}
      - {name: traefik, url: "https://helm.traefik.io/traefik/"}
      - {name: ingress-nginx, url: "https://kubernetes.github.io/ingress-nginx"}
      - {name: rook-release, url: "https://charts.rook.io/release"}
      - {name: longhorn, url: "https://charts.longhorn.io"}
      - {name: kuberay, url: "https://ray-project.github.io/kuberay-helm/"}
      - {name: jetstack, url: "https://charts.jetstack.io"}
      - {name: metallb, url: "https://metallb.github.io/metallb"}
  - name: Install / upgrade Metallb via Helm
    kubernetes.core.helm:
      name: metallb
      chart_ref: metallb/metallb
      release_namespace: metallb-system
      create_namespace: false
      wait: yes
      wait_timeout: 600s
      values:
        speaker:
          frr:
            enabled: false
  - name: Apply Metallb config (pools + BGP/L2)
    community.kubernetes.k8s:
      state: present
      src: "{{ playbook_dir }}/../metallb-config.yaml"
      wait: yes
      wait_timeout: 120
  # CNPG chart versions are PINNED on purpose. These two tasks used to be
  # unpinned, so the 2026-07-18 playbook run silently upgraded the operator
  # AND installed a second copy of the barman-cloud plugin next to the older
  # manifest-based install; the two copies deadlocked on the plugin's leader
  # lease (822e3f5c.cnpg.io) and every CNPG cluster using the plugin stopped
  # reconciling ("error while interacting with plugins") for 12 days. See
  # fighthealthinsurance/docs/pg-backup-reconciliation-runbook-2026-07.md.
  #
  # Rules:
  #   - helm (these tasks) is the ONLY installer for the operator and the
  #     plugin. Never `kubectl apply` the plugin release manifest.yaml -- that
  #     is how the duplicate install was born.
  #   - upgrades are deliberate pin bumps, one component at a time. Before
  #     bumping the plugin, read its release notes for Service-selector and
  #     sidecar changes (the v0.9->v0.13 selector break caused the -8 outage)
  #     and verify endpoints + a completed Backup afterwards
  #     (fighthealthinsurance/scripts/check-pg9-backup-health.sh).
  #   - wait: yes makes a wedged rollout (e.g. a pod stuck 0/1 waiting on the
  #     leader lease) fail THIS playbook loudly instead of rotting unnoticed.
  - name: Deploy cloud native postgres
    kubernetes.core.helm:
      name: cnpg
      chart_ref: cnpg/cloudnative-pg
      chart_version: 0.29.0  # operator 1.30.0 (matches live since 2026-07-18)
      release_namespace: cnpg-system
      create_namespace: true
      wait: yes
      wait_timeout: 300s
  - name: Deploy cloud native postgres backup plugin
    kubernetes.core.helm:
      name: barman-cloud
      chart_ref: cnpg/plugin-barman-cloud
      chart_version: 0.7.0  # plugin v0.13.0 (matches live + the -9 sidecars)
      release_namespace: cnpg-system
      create_namespace: true
      wait: yes
      wait_timeout: 300s
  - name: Deploy nginx
    kubernetes.core.helm:
      name: ingress-nginx
      chart_ref: ingress-nginx/ingress-nginx
      release_namespace: nginx
      chart_version: 4.13.4
      create_namespace: true
      wait: yes
      values:
        controller:
          service:
            loadBalancerIP: 10.42.0.200
            externalTrafficPolicy: Local
          watchIngressWithoutClass: true
          allowSnippetAnnotations: true
          ipFamilyPolicy: PreferDualStack
          ipFamilies:
            - IPv4
            - IPv6
          proxy-real-ip-cidr: "127.0.0.1/32,10.42.4.0/8"
          maxmindLicenseKey: "{{maxmindkey}}"
  - name: Deploy cert manager
    kubernetes.core.helm:
      name: cert-manager
      chart_ref: "jetstack/cert-manager"
      release_namespace: cert-manager
      chart_version: v1.19.1
      create_namespace: true
      wait: yes
      values:
        installCRDs: true
  - name: Create staging certificate issuer
    community.kubernetes.k8s:
      definition:
        apiVersion: cert-manager.io/v1
        kind: ClusterIssuer
        metadata:
          name: letsencrypt-staging
          namespace: cert-manager
        spec:
          acme:
            server: https://acme-staging-v02.api.letsencrypt.org/directory
            email: holden@pigscanfly.ca
            privateKeySecretRef:
              name: letsencrypt-staging
            solvers:
              - http01:
                  ingress:
                    class: nginx
  - name: Create prod certificate issuer
    community.kubernetes.k8s:
      definition:
        apiVersion: cert-manager.io/v1
        kind: ClusterIssuer
        metadata:
          name: letsencrypt
        spec:
          acme:
            server: https://acme-v02.api.letsencrypt.org/directory
            email: holden@pigscanfly.ca
            privateKeySecretRef:
              name: letsencrypt-prod
            solvers:
              - http01:
                  ingress:
                    class: nginx
  - name: Deploy longhorn
    kubernetes.core.helm:
      name: longhorn
      chart_ref: longhorn/longhorn
      release_namespace: longhorn-system
      chart_version: 1.10.1
      create_namespace: true
      values:
        defaultSettings:
          defaultDataPath: /db/encrypted/magic8
          createDefaultDiskLabeledNodes: true
  - name: Create minio secret for Jupyter
    community.kubernetes.k8s:
      definition:
        apiVersion: v1
        kind: Secret
        metadata:
          name: minio
          namespace: jhub
        type: Opaque
        stringData:
          accessKey: "{{minio_accesskey}}"
          secretKey: "{{minio_holden_secret}}"
      state: present
  - name: Create service accounts
    community.kubernetes.k8s:
      name: "{{ item.name }}"
      namespace: "{{ item.namespace }}"
      api_version: v1
      kind: serviceaccount
      state: present
    loop:
      - {name: holdenk, namespace: jhub}
      - {name: mkimmins, namespace: jhub}
      - {name: spark, namespace: spark}
  - name: Create role bindings
    community.kubernetes.k8s:
      name: "{{ item.name }}"
      namespace: "{{ item.namespace }}"
      definition:
        roleRef:
          apiGroup: rbac.authorization.k8s.io
          kind: ClusterRole
          name: edit
        subjects:
        - kind: ServiceAccount
          name: "{{ item.sa_name }}"
          namespace: "{{ item.sa_namespace }}"
      api_version: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      state: present
    loop:
      - {name: jhub-holdenk-rb-dask, namespace: dask, sa_name: holdenk, sa_namespace: jhub}
      - {name: jhub-holdenk-rb-spark, namespace: dask, sa_name: holdenk, sa_namespace: jhub}
      - {name: jhub-holdenk-rb-ray, namespace: ray, sa_name: holdenk, sa_namespace: jhub}
      - {name: jhub-mika-rb, namespace: mika, sa_name: mkimmins, sa_namespace: jhub}
      - {name: spark-rb, namespace: spark, sa_name: spark, sa_namespace: spark}
  - name: Create longhorn Ingress https
    community.kubernetes.k8s:
      definition:
        apiVersion: networking.k8s.io/v1
        kind: Ingress
        metadata:
          name: longhorn-ingress
          namespace: longhorn-system
          annotations:
            nginx.ingress.kubernetes.io/auth-type: basic
            nginx.ingress.kubernetes.io/auth-secret: basic-auth
            nginx.ingress.kubernetes.io/auth-realm: 'Authentication Required '
            nginx.ingress.kubernetes.io/proxy-body-size: 10000m
        spec:
          ingressClassName: nginx
          rules:
            - host: "longhorn.pigscanfly.ca"
              http:
                paths:
                - pathType: Prefix
                  path: "/"
                  backend:
                    service:
                      name: longhorn-frontend
                      port:
                        number: 80
  - name: Deploy opensearch operator
    kubernetes.core.helm:
      name: opensearch-operator
      chart_ref: opensearch-operator/opensearch-operator
      release_namespace: opensearch
      create_namespace: true

---
# Idempotently ensure /db/encrypted is mounted on every kubernetes node.
#
# Unlike ecrypt.yaml (first-time setup: packages, module config, fstab) this
# playbook is deliberately lightweight so it is cheap to run on a schedule.
# It only (re)mounts /db/encrypted where it is not already mounted -- e.g.
# after a node reboots, since the fstab entry is "noauto" and never mounts the
# encrypted volume at boot without the passphrase.
#
# Requires ecrypt_pw (from passwd.yml vault). Typically invoked via the
# ensure-encrypted-mounts.sh cron wrapper:
#   ansible-playbook -i hosts.yaml --vault-id dev@secret \
#     --extra-vars @passwd.yml playbooks/ecrypt-ensure.yaml
- name: Ensure /db/encrypted ecryptfs is mounted on k8s nodes
  hosts: kubernetes
  become: true
  gather_facts: false

  vars_files:
    - ecrypt-vars.yaml

  tasks:
    - name: Ensure ecryptfs kernel modules are loaded
      ansible.builtin.modprobe:
        name: "{{ item }}"
        state: present
      loop: "{{ ecryptfs_modules }}"
      ignore_errors: true  # fine if built-in or differently named

    - name: Ensure backing directory exists
      ansible.builtin.file:
        path: "{{ ecryptfs_backing_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Ensure mount directory exists
      ansible.builtin.file:
        path: "{{ ecryptfs_mount_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Check if /db/encrypted is already a mountpoint
      ansible.builtin.command: mountpoint -q "{{ ecryptfs_mount_dir }}"
      register: ecryptfs_mountpoint_check
      failed_when: false
      changed_when: false

    - name: Mount /db/encrypted ecryptfs filesystem (explicit, using passphrase)
      ansible.builtin.command: >
        mount -t ecryptfs {{ ecryptfs_backing_dir }} {{ ecryptfs_mount_dir }}
        -o {{ ecryptfs_mount_opts }}
      when: ecryptfs_mountpoint_check.rc != 0
      register: ecryptfs_mount_result
      changed_when: ecryptfs_mount_result.rc == 0

---
- name: Configure /db/encrypted ecryptfs on k8s nodes
  hosts: kubernetes
  become: true
  gather_facts: true

  vars_files:
    - ecrypt-vars.yaml

  vars:
    # Basic package mapping; tweak if you have oddball distros
    ecryptfs_package_map:
      Debian: ["ecryptfs-utils"]
      Ubuntu: ["ecryptfs-utils"]
      RedHat: ["ecryptfs-utils"]
      CentOS: ["ecryptfs-utils"]
      Rocky: ["ecryptfs-utils"]

  tasks:
    - name: Determine ecryptfs packages for this OS
      ansible.builtin.set_fact:
        ecryptfs_packages: >-
          {{ ecryptfs_package_map.get(ansible_distribution,
             ecryptfs_package_map.get(ansible_os_family, ['ecryptfs-utils'])) }}

    - name: Install ecryptfs userspace / tools
      ansible.builtin.package:
        name: "{{ ecryptfs_packages }}"
        state: present

    - name: Ensure ecryptfs kernel modules are loaded now
      ansible.builtin.modprobe:
        name: "{{ item }}"
        state: present
      loop: "{{ ecryptfs_modules }}"
      ignore_errors: true  # fine if built-in or differently named

    - name: Ensure ecryptfs modules load at boot
      ansible.builtin.copy:
        dest: /etc/modules-load.d/ecryptfs.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          {% for m in ecryptfs_modules %}
          {{ m }}
          {% endfor %}

    - name: Ensure backing directory exists
      ansible.builtin.file:
        path: "{{ ecryptfs_backing_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Ensure mount directory exists
      ansible.builtin.file:
        path: "{{ ecryptfs_mount_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    # ------------------------------------------------------------------
    # Detect if it's already mounted; if it is, we don't touch keys/mount
    # ------------------------------------------------------------------
    - name: Check if /db/encrypted is already a mountpoint
      ansible.builtin.command: mountpoint -q "{{ ecryptfs_mount_dir }}"
      register: ecryptfs_mountpoint_check
      failed_when: false
      changed_when: false

    # ------------------------------------------------------------------
    # First-time / not-mounted path: ensure the (noauto) fstab entry and
    # mount using the passphrase (non-interactive). Option strings live in
    # ecrypt-vars.yaml so this and ecrypt-ensure.yaml can never drift.
    # ------------------------------------------------------------------
    - name: Ensure ecryptfs fstab entry (with noauto) is present
      ansible.builtin.mount:
        src: "{{ ecryptfs_backing_dir }}"
        path: "{{ ecryptfs_mount_dir }}"
        fstype: "{{ ecryptfs_fstype }}"
        opts: "{{ ecryptfs_fstab_opts }}"
        state: present
      when: ecryptfs_mountpoint_check.rc != 0

    - name: Mount /db/encrypted ecryptfs filesystem (explicit, using signature)
      ansible.builtin.command: >
        mount -t ecryptfs {{ ecryptfs_backing_dir }} {{ ecryptfs_mount_dir }}
        -o {{ ecryptfs_mount_opts }}
      when: ecryptfs_mountpoint_check.rc != 0
      register: ecryptfs_mount_result
      changed_when: ecryptfs_mount_result.rc == 0

    # ------------------------------------------------------------------
    # Drop the canary that ecrypt-ensure.yaml (cron) looks for. Only write
    # it while actually mounted, so we never pollute the bare mount dir, and
    # never overwrite an existing canary (force: false).
    # ------------------------------------------------------------------
    - name: Confirm /db/encrypted is mounted before writing the canary
      ansible.builtin.command: mountpoint -q "{{ ecryptfs_mount_dir }}"
      register: ecryptfs_mounted_now
      failed_when: false
      changed_when: false

    - name: Ensure the /db/encrypted canary file exists
      ansible.builtin.copy:
        dest: "{{ ecryptfs_canary_file }}"
        content: "safe\n"
        force: false
        owner: root
        group: root
        mode: "0644"
      when: ecryptfs_mounted_now.rc == 0

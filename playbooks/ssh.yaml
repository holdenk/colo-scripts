---
- hosts: all
  tasks:
  - name: Create user accounts with sudo access
    ansible.builtin.user:
      name: "{{ item.name }}"
      shell: /bin/bash
      groups: sudo
      append: yes
    become: yes
    loop:
      - {name: holden}
      - {name: warrick}
  - name: create user private keys if not present
    ansible.builtin.shell: "mkdir ~/.ssh; ssh-keygen  -N '' -f ~/.ssh/id_rsa"
    args:
      creates: "~/.ssh/id_rsa"
  - name: create root private keys if not present
    ansible.builtin.shell: "mkdir ~/.ssh; ssh-keygen  -N '' -f ~/.ssh/id_rsa"
    args:
      creates: "/root/.ssh/id_rsa"
    become: true
  - name: Pull holden SSH keys from GitHub
    uri:
      url: https://github.com/holdenk.keys
      return_content: true
    register: holden_keys
    failed_when: "'ssh-rsa' not in holden_keys.content"
  - name: Configure holden SSH access
    authorized_key:
      user: holden
      state: present
      key: "{{ holden_keys.content }}"
  - name: Pull warrick SSH keys from GitHub
    uri:
      url: https://github.com/nyghtowl.keys
      return_content: true
    register: warrick_keys
    failed_when: "'ssh-rsa' not in warrick_keys.content"
  - name: Configure warrick SSH access
    authorized_key:
      user: warrick
      state: present
      key: "{{ warrick_keys.content }}"
    become: yes
  - name: Configure root SSH access
    authorized_key:
      user: root
      state: present
      key: "{{ holden_keys.content }}"
    become: true
  - name: Make everyone have a public key
    ansible.builtin.shell: "mkdir -p /root/.ssh; (ssh-keygen -y -f /root/.ssh/id_rsa > /root/.ssh/id_rsa.pub)"
    args:
      creates: "/root/.ssh/id_rsa.pub"
    become: true

  # Reflexive root access (needed for k3sup)
  - name: Fetch the root keyfile from each node
    fetch:
      src: "~/.ssh/id_rsa.pub"
      dest: "buffer/{{inventory_hostname}}-id_rsa.pub"
      flat: yes
    become: yes

  - name: Fetch the user keyfile from each node
    fetch:
      src: "~/.ssh/id_rsa.pub"
      dest: "buffer/{{inventory_hostname}}-id_rsa_magic.pub"
      flat: yes

  - name: Copy root keys to authorized_keys
    authorized_key:
      user: root
      state: present
      key: "{{ lookup('file','buffer/{{item}}-id_rsa.pub')}}"
    with_items:
      - "{{ groups['kubernetes'] }}"
    become: yes
  - name: Copy user keys to authorized_keys
    authorized_key:
      user: root
      state: present
      key: "{{ lookup('file','buffer/{{item}}-id_rsa_magic.pub')}}"
    with_items:
      - "{{ groups['kubernetes'] }}"
    become: yes
  - name: Remove PermitRootLogin no from sshd config
    ansible.builtin.lineinfile:
      path: /etc/ssh/sshd_config
      state: absent
      regexp: '^PermitRootLogin no'
    become: yes
  - name: Remove PasswordAuthentication no from sshd config
    ansible.builtin.lineinfile:
      path: /etc/ssh/sshd_config
      state: absent
      regexp: '^PasswordAuthentication no'
    become: yes
  - name: Allow root login via SSH
    ansible.builtin.lineinfile:
      path: /etc/ssh/sshd_config
      line: "PermitRootLogin yes"
    become: yes
